services:

  db:
    image: postgres:{{cookiecutter.postgres_version}}
    container_name: {{cookiecutter.project_slug}}_postgres
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB={{cookiecutter.project_slug}}
      - POSTGRES_USER={{cookiecutter.postgres_user}}
      - POSTGRES_PASSWORD={{cookiecutter.postgres_password}}
    volumes:
      # Named volume avoids Docker Desktop (macOS) UID ownership FATAL on bind mounts.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{cookiecutter.postgres_user}} -d {{cookiecutter.project_slug}}"]
      interval: 5s
      timeout: 5s
      retries: 5

{%- if cookiecutter.use_pgadmin == "y" %}
  pgadmin:
    container_name: {{cookiecutter.project_slug}}_pgadmin
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: 'pg_pass'
    ports:
      - "5050:80"
    volumes:
      - ./volumes/pgadmin:/var/lib/pgadmin

{%- endif %}
{%- if cookiecutter.use_rabbitmq == "y" %}
  rabbitmq:
    # Pin major line; floating :alpine tracks RabbitMQ 4+ which rejects Celery's
    # transient non-exclusive queues unless permitted in rabbitmq.conf.
    image: rabbitmq:4.1-alpine
    container_name: {{cookiecutter.project_slug}}_rabbitmq
    ports:
      - 5672:5672
    volumes:
      - ./volumes/rabbitmq:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3

{%- endif %}
{%- if cookiecutter.use_redis == "y" %}
  redis:
    image: redis:7.4.9
    container_name: {{cookiecutter.project_slug}}_redis
    ports:
      - 6379:6379
    volumes:
      - ./volumes/redis:/data

{%- endif %}

volumes:
  postgres_data:
