name: Template CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: template-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-generate:
    name: Smoke generate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install "cookiecutter>=2.4"
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Smoke generate matrices
        env:
          DSG_COOKIECUTTER_SKIP_PROMPT_UI: "1"
          SMOKE_OUT: ${{ runner.temp }}/dsg_smoke
        run: ./scripts/smoke_generate.sh

  generate-and-test:
    name: Generate (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: smoke-generate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: jwt-defaults
            project_dir: JwtDefaults
            run_pytest: "y"
            extra: >-
              project_name=JwtDefaults
              use_jwt=y
              use_uuid_pk=y
              use_redis=n
              use_rabbitmq=n
              use_celery=n
              use_asgi=n
              use_websockets=n
              reverse_proxy=none
              use_code_style=y
              use_testing=y
              use_ci=n
          - name: int-pk
            project_dir: IntPk
            run_pytest: "y"
            extra: >-
              project_name=IntPk
              use_jwt=y
              use_uuid_pk=n
              use_redis=n
              use_celery=n
              use_asgi=n
              use_websockets=n
              reverse_proxy=none
              use_code_style=y
              use_testing=y
              use_ci=n
          - name: session-redis-celery
            project_dir: SessionCelery
            run_pytest: "y"
            extra: >-
              project_name=SessionCelery
              use_jwt=n
              use_redis=y
              use_rabbitmq=n
              use_celery=y
              celery_broker=redis
              use_asgi=n
              use_websockets=n
              reverse_proxy=nginx
              use_code_style=y
              use_testing=y
              use_ci=n
          - name: rabbitmq-celery
            project_dir: RabbitCelery
            run_pytest: "y"
            extra: >-
              project_name=RabbitCelery
              use_jwt=y
              use_redis=n
              use_rabbitmq=y
              use_celery=y
              celery_broker=rabbitmq
              use_asgi=n
              use_websockets=n
              reverse_proxy=none
              use_code_style=y
              use_testing=y
              use_ci=n
          - name: asgi-websockets
            project_dir: AsgiWs
            run_pytest: "y"
            extra: >-
              project_name=AsgiWs
              use_jwt=y
              use_redis=y
              use_rabbitmq=n
              use_celery=n
              use_asgi=y
              use_websockets=y
              reverse_proxy=traefik
              use_code_style=y
              use_testing=y
              use_ci=n
          - name: no-testing-gitlab
            project_dir: NoTest
            run_pytest: "n"
            extra: >-
              project_name=NoTest
              use_jwt=y
              use_redis=n
              use_celery=n
              use_asgi=n
              use_websockets=n
              reverse_proxy=none
              use_code_style=y
              use_testing=n
              use_ci=y
              ci_provider=gitlab
          - name: flake8-only
            project_dir: FlakeOnly
            run_pytest: "y"
            extra: >-
              project_name=FlakeOnly
              use_jwt=y
              use_redis=n
              use_celery=n
              use_asgi=n
              use_websockets=n
              reverse_proxy=none
              use_code_style=n
              use_testing=y
              use_ci=n

    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install cookiecutter
        run: |
          python -m pip install --upgrade pip
          pip install "cookiecutter>=2.4"

      - name: Generate project
        env:
          DSG_COOKIECUTTER_SKIP_PROMPT_UI: "1"
        run: |
          cookiecutter . --no-input \
            ${{ matrix.extra }} \
            postgres_user=user \
            postgres_password=password \
            postgres_version=17.10

      - name: Install generated project deps
        working-directory: ${{ matrix.project_dir }}
        run: |
          python -m pip install -r requirements_dev.txt

      - name: Ruff (when code style enabled)
        if: contains(matrix.extra, 'use_code_style=y')
        working-directory: ${{ matrix.project_dir }}
        run: |
          # Normalize Jinja whitespace leftovers so lint matches local pre-commit.
          ruff check --fix .
          ruff format .
          ruff check .
          ruff format --check .

      - name: Django check
        working-directory: ${{ matrix.project_dir }}
        env:
          DJANGO_SETTINGS_MODULE: ${{ matrix.run_pytest == 'y' && 'config.django.test' || 'config.django.local' }}
          SECRET_KEY: ci-secret-key-not-for-production
          DATABASE_URL: ${{ matrix.run_pytest == 'y' && 'psql://user:password@127.0.0.1:5432/test_db' || 'sqlite:///ci.sqlite3' }}
        run: python manage.py check

      - name: Pytest
        if: matrix.run_pytest == 'y'
        working-directory: ${{ matrix.project_dir }}
        env:
          DJANGO_SETTINGS_MODULE: config.django.test
          SECRET_KEY: ci-secret-key-not-for-production
          DATABASE_URL: psql://user:password@127.0.0.1:5432/test_db
        run: pytest -q --cov-fail-under=0
